name: ci

# Manual runs only for now: GitHub won't start jobs on this account until its Actions billing is fixed.
# To run on every push again, put back:  push: {branches: [main]}  and  pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
