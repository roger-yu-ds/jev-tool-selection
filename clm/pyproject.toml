[project]
name = "clm-local"
version = "0.1.0"
description = "CLM-8B (contrastive-lm 0.1.0) served locally for the tool-selection study: heads on CPU, Qwen3-8B encoder in llama.cpp"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contrastive-lm==0.1.0",   # its vllm requirement is overridden away below
    "numpy>=1.24",
    "requests>=2.28",
    "torch>=2.6",              # CPU wheel; >=2.6 so torch.load defaults to weights_only=True
    "fastapi>=0.100",
    "pydantic>=2.7",
    "uvicorn>=0.23",
    "huggingface_hub>=0.20",
]

[dependency-groups]
# the 0.6B parity check: HF transformers fp32 reference, GGUF metadata
validate = ["transformers>=4.51", "safetensors>=0.4", "gguf>=0.10", "sentencepiece>=0.2"]  # sentencepiece: llama.cpp's converter probes it before falling back to BPE

[tool.uv]
package = false
default-groups = ["validate"]
# Linux only: with a universal lock the never-true marker below still opens a resolution fork for
# vllm, which backtracks to vllm 0.1.3 and drags pydantic down to 1.x.
environments = ["sys_platform == 'linux'"]
# contrastive-lm requires vllm>=0.6; vLLM cannot run on this GPU (GTX 1080 Ti, sm_61), and the encoder
# is llama.cpp instead, so vllm is removed from the resolution with a marker that is never true.
override-dependencies = ["vllm; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
