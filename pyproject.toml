[project]
name = "toolpick"
version = "0.1.0"
description = "Who picks the tool? Measuring tool selection on real MCP servers (MeasureCamp Sydney, 24 Oct 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "altair>=5.4",
    "marimo>=0.14",
    "openai>=1.60",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "scipy>=1.14",
]

[project.optional-dependencies]
optimise = ["dspy>=3.4"]
langfuse = ["langfuse>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolpick"]

[tool.ruff]
line-length = 120
target-version = "py312"
